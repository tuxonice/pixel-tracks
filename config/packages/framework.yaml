# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    enabled_locales: ['en', 'pt']
    set_locale_from_accept_language: true

    # Only Host headers matching one of these regexes are accepted; anything else gets a 400.
    # This is what keeps generated absolute URLs from being Host-header spoofed.
    trusted_hosts: '%env(SYMFONY_TRUSTED_HOSTS)%'

    # Empty resolves to null via the `default::` processor, i.e. "trust no proxies".
    # Set SYMFONY_TRUSTED_PROXIES when running behind a reverse proxy.
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    rate_limiter:
        login_code_by_ip:
            policy: 'token_bucket'
            limit: '%env(int:RATE_LIMITER_MAX_CAPACITY)%'
            rate: { interval: '%app.rate_limiter_interval%', amount: '%env(int:RATE_LIMITER_MAX_CAPACITY)%' }
        login_code_by_email:
            policy: 'token_bucket'
            limit: '%env(int:RATE_LIMITER_MAX_CAPACITY)%'
            rate: { interval: '%app.rate_limiter_interval%', amount: '%env(int:RATE_LIMITER_MAX_CAPACITY)%' }
        login_code_verify_by_email:
            policy: 'token_bucket'
            limit: '%env(int:RATE_LIMITER_MAX_CAPACITY)%'
            rate: { interval: '%app.rate_limiter_interval%', amount: '%env(int:RATE_LIMITER_MAX_CAPACITY)%' }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
