name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

jobs:
  Tests:
    runs-on: ubuntu-latest

    env:
      SYMFONY_PHPUNIT_VERSION: '11.4'

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@690cb7c9d81dbfe51eba732cfca0a00ca42db777
        with:
          php-version: '8.4'
          extensions: dom, simplexml, sqlite3, xml, json, libxml
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.dist', '.env');"
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Run Code style
        run: vendor/bin/phpcs
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse
      - name: Migrate test database
        run: bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Run tests
        run: vendor/bin/simple-phpunit
